<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign up</title>
    <style>
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: url("assets/img/background\ image\ -\ Copy.jpg");
    background-repeat:no-repeat ;
    background-position: center;
    background-size: cover;
}

.container {
    background: #fff;
    padding: 30px;
    width: 350px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    animation: fadein 0.8s, ease-in-out;
    margin-top: 50px;



}
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.container h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

.input-group {
    margin-bottom: 15px;
    position: relative;
}

.input-group input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    outline: none;
    transition: 0.3s;
}

.input-group input:focus {
    border-color: #273755;
    box-shadow: 0 0 5px rgba(9, 59, 222, 0.5);
}

.input-group label {
    position: relative;
    top: 50%;
    left: 12px;
    transform: translateY(-50%);
    background: #fff;
    padding: 0 5px;
    color: #999;
    font-size: 14px;
    transition: 0.3s;
    pointer-events: none;
}

.input-group input:focus+label,
.input-group input:valid+label {
    top: 0px;
    font-size: 12px;
    color: #273755;
}

.btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(to RIGHT, #111111, #273755, #7FDBFF);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

.footer {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;

}

.footer a {
    color: #273755;
    text-decoration: none;
    font-weight: 600;
}
</style>
</head>

<body class="body">
    <section class="bg-image">
        <div class="container">
            <div class="row">
                <form action="" id="signup">
                    <h2>Create Account</h2>
                    <div class="input-group">
                        <input type="text" name="" id="username">
                        <label>Full name</label>
                    </div>
                    <div class="input-group">
                        <input type="Email" name="" id="email">
                        <label>Email Address</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password">
                        <label> password</label>
                    </div>
                    <div class="input-group">
                        <input type="password" id="confirmpassword">
                        <label>confirm password</label>
                    </div>
                    <button  type="submit" class="btn">Sign up</button>
                    <div class="footer">
                        Already have an account?
                        <a href="login.html">Log in</a>
                    </div>
                </form>
            </div>
        </div>
    </section>


    <script>
        // sign up js section
        document.getElementById("signup").addEventListener("submit", function (e) {
            e.preventDefault();
            var name = document.getElementById("username").value;
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            var confirmpassword = document.getElementById("confirmpassword").value;

            if (name !== '' || email !== '' || password !== '' || confirmpassword !== '') {
                alert("sign up seccessfully")
            }
            else {
                alert("all fields are required")
            }

            if (password !== confirmpassword) {
                alert("Password and Confirm Password do not match")
            }
            var user = {
                email,
                password,
                confirmpassword
            }
            localStorage.setItem("user", JSON.stringify(user));
        });
        $("#passwordview").click(function () {
            if ($("#password").attr('type') == 'password') {
                $("#password").attr('type', 'text');
            } else {
                $("#password").attr('type', 'password');
            }
        });
        $("#confirmpasswordview").click(function () {
            if ($("#confirmpassword").attr('type') == 'password') {
                $("#confirmpassword").attr('type', 'text');
            } else {
                $("#confirmpassword").attr('type', 'password');
            }
        });
        // Sign up js section
    </script>
</body>

</html>
